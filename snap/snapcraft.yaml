name: ansel
version: "0.0.0"
adopt-info: ansel
grade: stable
confinement: strict
base: core26
compression: lzo

donation: "https://liberapay.com/aurelienpierre"
source-code: "https://github.com/aurelienpierreeng/ansel"
website: "https://ansel.photos"

lint:
  ignore:
    - library:
      # OpenCL ICDs are dlopen()ed by ocl-icd through /etc/OpenCL/vendors, never linked
      - usr/lib/*/libRusticlOpenCL.so*
      - usr/lib/*/intel-opencl/libigdrcl.so
      # ... and so is everything only they need: the linter, skipping them, sees no user
      - usr/lib/*/libclang-cpp.so*
      - usr/lib/*/libLLVMSPIRVLib.so*
      - usr/lib/*/libigc.so*
      - usr/lib/*/libigdfcl.so*
      - usr/lib/*/libiga64.so*
      # src/common/dlopencl.c dlopen()s it
      - usr/lib/*/libOpenCL.so*

platforms:
  amd64:
  arm64:

apps:
  ansel:
    command: usr/bin/ansel --datadir $SNAP/usr/share/ansel --moduledir $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ansel --configdir $SNAP_USER_DATA --localedir $SNAP/usr/share/locale
    environment:
      GTK_USE_PORTAL: 0
      OCL_ICD_VENDORS: $SNAP/etc/OpenCL/vendors
    extensions: [gnome]
    plugs: &ansel-plugs
      - opengl
      - home
      - removable-media
      - password-manager-service
      - network
      - network-bind
      # https://forum.snapcraft.io/t/help-gdbus-error-this-call-is-not-available-inside-the-sandbox/29969/5
      - network-status
      # the gnome extension no longer adds it on core26
      - gsettings
    common-id: photos.ansel.Ansel
  cli:
    command: usr/bin/ansel-cli --datadir $SNAP/usr/share/ansel --moduledir $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ansel --configdir $SNAP_USER_DATA --localedir $SNAP/usr/share/locale
    environment:
      OCL_ICD_VENDORS: $SNAP/etc/OpenCL/vendors
    extensions: [gnome]
    plugs: *ansel-plugs

  # Fetches lensfun's newest calibrations into ~/.local/share/lensfun ...
  lensfun-update-data:
    command: usr/bin/lensfun-update-data
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
    plugs:
      - network
  # ... and this folds them, and the user's own profiles, into Ansel's lenses.db
  lens-db-update:
    command: usr/bin/ansel-lens-db-update --configdir $SNAP_USER_DATA --datadir $SNAP/usr/share/ansel
    extensions: [gnome]
    plugs:
      - home

slots:
  session-dbus-interface:
    interface: dbus
    name: org.darktable.service
    bus: session

layout:
  # rusticl (mesa-opencl-icd) loads libclc from its build-time path
  /usr/lib/clc:
    symlink: $SNAP/usr/lib/clc
  # intel.icd names its driver by absolute path
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl

parts:
  opencl:
    plugin: nil
    stage-packages:
      - mesa-opencl-icd
      - ocl-icd-libopencl1
      - on amd64:
        - intel-opencl-icd
    stage:
      # clang's sanitizer and profiling runtimes, pulled in through libclc; rusticl needs none
      - -usr/lib/llvm-*/lib/clang/*/lib
      - -usr/share/doc
    # Libraries the stage-packages drag in that nothing in the snap links, per the
    # library linter. The first group is provided by gnome-core26 at runtime.
    prime: &unused-libraries
      - -usr/lib/*/libatk-1.0.so*
      - -usr/lib/*/libcairo.so*
      - -usr/lib/*/libcairo-gobject.so*
      - -usr/lib/*/libfontconfig.so*
      - -usr/lib/*/libgdk_pixbuf-2.0.so*
      - -usr/lib/*/libharfbuzz.so*
      - -usr/lib/*/libpango-1.0.so*
      - -usr/lib/*/libpangocairo-1.0.so*
      - -usr/lib/*/libpangoft2-1.0.so*
      - -usr/lib/*/libpsl.so*
      - -usr/lib/*/librsvg-2.so*
      - -usr/lib/*/libsoup-3.0.so*
      - -usr/lib/*/libOpenEXRUtil-3_1.so*
      - -usr/lib/libGraphicsMagickWand-Q16.so*
      - -usr/lib/*/libabsl_civil_time.so*
      - -usr/lib/*/libabsl_cordz_sample_token.so*
      - -usr/lib/*/libabsl_crc_cpu_detect.so*
      - -usr/lib/*/libabsl_die_if_null.so*
      - -usr/lib/*/libabsl_failure_signal_handler.so*
      - -usr/lib/*/libabsl_flags_parse.so*
      - -usr/lib/*/libabsl_generic_printer_internal.so*
      - -usr/lib/*/libabsl_hashtable_profiler.so*
      - -usr/lib/*/libabsl_log_entry.so*
      - -usr/lib/*/libabsl_log_flags.so*
      - -usr/lib/*/libabsl_log_initialize.so*
      - -usr/lib/*/libabsl_log_internal_check_op.so*
      - -usr/lib/*/libabsl_log_internal_conditions.so*
      - -usr/lib/*/libabsl_periodic_sampler.so*
      - -usr/lib/*/libabsl_poison.so*
      - -usr/lib/*/libabsl_random_distributions.so*
      - -usr/lib/*/libabsl_random_internal_distribution_test_util.so*
      - -usr/lib/*/libabsl_random_seed_sequences.so*
      - -usr/lib/*/libabsl_scoped_set_env.so*
      - -usr/lib/*/libabsl_statusor.so*

  ansel:
    after: [opencl]
    plugin: cmake
    source: https://github.com/aurelienpierreeng/ansel.git
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      # Place the data alongside that coming from stage-packages
      - -DCMAKE_INSTALL_PREFIX=/usr
      # Don't overly optimize for build CPU-- stay generic
      - -DBINARY_PACKAGE_BUILD=ON
      - -DUSE_COLORD=ON
    stage-packages:
      - libavif16
      - libcmark0.30.2
      - libcolord-gtk1t64
      - libcups2t64
      - libgraphicsmagick-q16-3t64
      - libimage-exiftool-perl
      - liblensfun-bin
      - liblensfun-data-v1
      - liblensfun1
      - libopenexr-3-1-30
      - libosmgpsmap-1.0-1
      - libpugixml1v5
      - libsdl2-2.0-0
    build-packages:
      - g++
      - gcc
      - intltool
      - libavif-dev
      - libcmark-dev
      - libcolord-dev
      - libcolord-gtk-dev
      - libcups2-dev
      - libgraphicsmagick1-dev
      - liblensfun-dev
      - libopenexr-dev
      - libosmgpsmap-1.0-dev
      - libpugixml-dev
      - libsdl2-dev
      - libxml2-utils
      - ninja-build
      - ocl-icd-opencl-dev
      - opencl-headers
      - pkg-config
      - python3-jsonschema
      - xsltproc
    build-environment:
      # The SDK ships glibc's headers, and pkg-config hands its usr/include to the compiler
      # as -isystem, ahead of libstdc++'s. A C++ `#include <math.h>` then finds glibc's
      # header instead of libstdc++'s wrapper, which is what puts isnan/isfinite in the
      # global namespace once <cmath> has undefined the C macros. Including the wrapper
      # first restores what an ordinary build gets. CMake reads CXXFLAGS only on a fresh
      # configure: after changing this, `snapcraft clean ansel`.
      - CXXFLAGS: "${CXXFLAGS:-} -include /usr/include/c++/$(g++ -dumpversion)/math.h"
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags)
    parse-info:
      - usr/share/metainfo/photos.ansel.Ansel.appdata.xml
    stage:
      - -usr/share/man
    prime: *unused-libraries
